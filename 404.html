    <title>AdBoard — Local Advertising</title>
    <script>
      // Theme bootstrap — runs BEFORE first paint so a returning dark-mode
      // visitor never sees a light flash (and vice versa). Must stay in
      // sync with src/hooks/useTheme.jsx (THEME key + applyTheme).
      (function () {
        try {
          var t = localStorage.getItem('adboard_theme');
          if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
          // 'light' (or anything else) = default: no attribute needed.
        } catch (e) {
          /* storage unavailable — light default applies */
        }
      })();
    </script>
